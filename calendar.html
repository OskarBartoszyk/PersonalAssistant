<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendarz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F131C;
    --panel:#161B27;
    --panel-raised:#1E2433;
    --border:#2A3142;
    --border-soft:#232939;
    --text:#EDEFF4;
    --text-muted:#8890A6;
    --text-faint:#586079;
    --brass:#CDA349;
    --brass-dim:#8A7237;
    --danger:#E0785B;

    --c-habit:#5FB88A;
    --c-entertainment:#A98CE0;
    --c-meeting:#5B9BE0;
    --c-important:#E0785B;
    --c-focus:#3FB8B0;

    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;

    --px-per-min: 1.5;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:1100px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  /* ---- Header ---- */
  .header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }

  .header-left{ display:flex; flex-direction:column; gap:4px; }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
  }

  .date-title{
    font-family:var(--font-display);
    font-size:clamp(22px, 3.6vw, 32px);
    font-weight:500;
    font-variation-settings:'opsz' 32;
    margin:0;
    line-height:1.15;
  }

  .header-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .view-switch{
    display:flex;
    gap:3px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:3px;
    margin-right:4px;
  }
  .view-switch button{
    font-family:var(--font-mono);
    font-size:11.5px;
    padding:6px 11px;
    border-radius:7px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
  }
  .view-switch button.active{ background:var(--brass); color:#1A1508; font-weight:600; }
  .view-switch button:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  .nav-btn{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    cursor:pointer;
    font-size:15px;
  }
  .nav-btn:hover{ border-color:var(--brass-dim); background:#232A3C; }
  .nav-btn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  .today-btn{
    font-family:var(--font-mono);
    font-size:12px;
    padding:0 12px;
    height:34px;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text-muted);
    cursor:pointer;
  }
  .today-btn:hover{ color:var(--text); border-color:var(--brass-dim); }
  .today-btn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  .add-btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    padding:0 16px;
    height:34px;
    background:var(--brass);
    border:1px solid var(--brass);
    border-radius:8px;
    color:#1A1508;
    cursor:pointer;
  }
  .add-btn:hover{ background:#DCB35A; }
  .add-btn:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

  /* ---- Clock strip ---- */
  .clock-strip{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-faint);
    margin-bottom:20px;
  }
  .clock-dot{ width:6px; height:6px; border-radius:50%; background:var(--brass); }
  .clock-time{ color:var(--brass); font-weight:500; }

  /* ---- Legend ---- */
  .legend{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .chip{
    display:flex; align-items:center; gap:7px;
    padding:6px 12px 6px 10px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--panel);
    font-size:12.5px;
    color:var(--text-muted);
    cursor:pointer;
  }
  .chip:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .chip.off{ opacity:0.38; }
  .chip .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .chip .count{ font-family:var(--font-mono); color:var(--text-faint); }

  /* ---- Shared timeline shell ---- */
  .timeline-wrap{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }
  .timeline-scroll{
    height:min(60vh, 600px);
    overflow-y:auto;
    overflow-x:auto;
  }
  .timeline-grid{ display:flex; position:relative; }

  .ruler{
    flex:none;
    width:52px;
    position:relative;
    border-right:1px solid var(--border);
    background:var(--panel);
  }
  .ruler-hour{
    position:absolute; left:0; right:0;
    transform:translateY(-50%);
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-faint);
    text-align:right;
    padding-right:8px;
  }

  .track{ flex:1; position:relative; cursor:crosshair; min-width:280px; }

  .hour-line{ position:absolute; left:0; right:0; border-top:1px solid var(--border-soft); }
  .quarter-line{ position:absolute; left:0; right:0; border-top:1px dashed rgba(42,49,66,0.5); }

  .now-line{ position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--brass); z-index:5; pointer-events:none; }
  .now-line::before{ content:''; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--brass); }
  .now-label{
    position:absolute; left:4px; top:-9px;
    font-family:var(--font-mono); font-size:9.5px; color:#1A1508;
    background:var(--brass); padding:1px 5px; border-radius:4px; font-weight:600;
  }

  .event{
    position:absolute; border-radius:7px; padding:5px 8px; overflow:hidden;
    cursor:pointer; border:1px solid transparent;
  }
  .event:hover{ filter:brightness(1.12); }
  .event:focus-visible{ outline:2px solid #fff; outline-offset:1px; }
  .event-title{
    font-size:12.5px; font-weight:600; color:#0C0F16; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .event-time{ font-family:var(--font-mono); font-size:10px; color:rgba(12,15,22,0.72); margin-top:1px; }
  .event.compact .event-title{ font-size:10.5px; }
  .event.compact .event-time{ font-size:8.5px; }
  .event.conflict::after{ content:'⚠'; position:absolute; top:3px; right:5px; font-size:10px; }

  .empty-day{ padding:60px 20px; text-align:center; color:var(--text-faint); font-size:13.5px; position:absolute; top:220px; left:0; right:0; }
  .empty-day strong{ color:var(--text-muted); display:block; margin-bottom:4px; font-weight:600; }

  /* ---- Week view specific ---- */
  .week-header{ display:flex; border-bottom:1px solid var(--border); }
  .week-header .spacer{ width:52px; flex:none; }
  .week-header .day-head{
    flex:1; min-width:110px; text-align:center; padding:9px 4px;
    font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted);
    border-left:1px solid var(--border-soft); text-transform:uppercase; letter-spacing:.04em;
  }
  .week-header .day-head .num{
    font-family:var(--font-display); font-size:16px; color:var(--text);
    display:block; margin-top:3px; text-transform:none;
  }
  .week-header .day-head.today{ color:var(--brass); }
  .week-header .day-head.today .num{ color:var(--brass); }

  .week-columns{ display:flex; flex:1; position:relative; }
  .week-col{ flex:1; min-width:110px; position:relative; border-left:1px solid var(--border-soft); cursor:crosshair; }

  /* ---- Month view ---- */
  .month-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-bottom:none;
    border-radius:14px 14px 0 0; overflow:hidden;
  }
  .month-weekday{
    background:var(--panel-raised); padding:8px 0; text-align:center;
    font-family:var(--font-mono); font-size:10px; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:.05em;
  }
  .month-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:0 0 14px 14px; overflow:hidden;
  }
  .month-cell{
    background:var(--panel); min-height:92px; padding:6px; cursor:pointer;
    display:flex; flex-direction:column; gap:3px;
  }
  .month-cell:hover{ background:var(--panel-raised); }
  .month-cell.outside{ opacity:.32; }
  .cell-num{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); }
  .cell-num.today{ color:#1A1508; background:var(--brass); border-radius:6px; padding:1px 6px; width:fit-content; font-weight:600; }
  .cell-pill{
    font-size:10px; padding:1.5px 6px; border-radius:5px; color:#0C0F16;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; cursor:pointer;
  }
  .cell-more{ font-size:9.5px; color:var(--text-faint); font-family:var(--font-mono); }

  .view-panel[hidden]{ display:none; }

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,8,13,0.6);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay[hidden]{ display:none; }
  .modal{ width:100%; max-width:400px; background:var(--panel-raised); border:1px solid var(--border); border-radius:14px; padding:22px; }
  .modal h2{ font-family:var(--font-display); font-weight:500; font-size:20px; margin:0 0 16px; }

  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:11.5px; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:6px; font-family:var(--font-mono);
  }
  .field input[type=text], .field textarea, .field input[type=date]{
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:9px 11px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .field input[type=date]{ font-family:var(--font-mono); }
  .field textarea{ resize:vertical; min-height:56px; }
  .field input[type=time]{
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:8px 11px; color:var(--text); font-family:var(--font-mono); font-size:14px;
  }
  .field input:focus-visible, .field textarea:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }

  .time-row{ display:flex; gap:10px; }
  .time-row .field{ flex:1; }

  .cat-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .cat-btn{
    display:flex; align-items:center; gap:6px; padding:7px 11px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text-muted);
    font-size:12.5px; cursor:pointer;
  }
  .cat-btn .dot{ width:8px; height:8px; border-radius:50%; }
  .cat-btn.active{ border-color:var(--brass); color:var(--text); background:#232A3C; }
  .cat-btn:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }

  .error-text{ color:var(--danger); font-size:12px; margin:-6px 0 12px; min-height:14px; }

  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
  .btn-group{ display:flex; gap:8px; margin-left:auto; }

  .btn{
    font-family:var(--font-body); font-size:13px; font-weight:600; padding:9px 16px;
    border-radius:8px; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text-muted);
  }
  .btn:hover{ color:var(--text); border-color:var(--brass-dim); }
  .btn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .btn-primary{ background:var(--brass); border-color:var(--brass); color:#1A1508; }
  .btn-primary:hover{ background:#DCB35A; color:#1A1508; }
  .btn-delete{ background:transparent; border:none; color:var(--danger); font-size:12.5px; cursor:pointer; padding:9px 4px; }
  .btn-delete:focus-visible{ outline:2px solid var(--danger); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  @media (max-width:560px){
    .header{ align-items:flex-start; }
    .header-right{ width:100%; }
    .modal{ padding:18px; }
    .month-cell{ min-height:64px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-left">
      <span class="eyebrow" id="eyebrow">Twój dzień</span>
      <h1 class="date-title" id="dateTitle">—</h1>
    </div>
    <div class="header-right">
      <div class="view-switch" id="viewSwitch">
        <button data-view="day" class="active">Dzień</button>
        <button data-view="week">Tydzień</button>
        <button data-view="month">Miesiąc</button>
      </div>
      <button class="nav-btn" id="prevBtn" aria-label="Wstecz">‹</button>
      <button class="today-btn" id="todayBtn">Dziś</button>
      <button class="nav-btn" id="nextBtn" aria-label="Dalej">›</button>
      <button class="add-btn" id="openAdd">+ Dodaj wydarzenie</button>
    </div>
  </div>

  <div class="clock-strip">
    <span class="clock-dot"></span>
    <span>Aktualny czas —</span>
    <span class="clock-time" id="liveClock">--:--</span>
  </div>

  <div class="legend" id="legend"></div>

  <!-- DAY VIEW -->
  <div class="view-panel" id="dayView">
    <div class="timeline-wrap">
      <div class="timeline-scroll" id="dayScroll">
        <div class="timeline-grid">
          <div class="ruler" id="dayRuler"></div>
          <div class="track" id="dayTrack"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- WEEK VIEW -->
  <div class="view-panel" id="weekView" hidden>
    <div class="timeline-wrap">
      <div class="week-header" id="weekHeader"></div>
      <div class="timeline-scroll" id="weekScroll">
        <div class="timeline-grid">
          <div class="ruler" id="weekRuler"></div>
          <div class="week-columns" id="weekColumns"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MONTH VIEW -->
  <div class="view-panel" id="monthView" hidden>
    <div class="month-weekdays" id="monthWeekdays"></div>
    <div class="month-grid" id="monthGrid"></div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">Nowe wydarzenie</h2>

    <div class="field">
      <label for="fTitle">Nazwa</label>
      <input type="text" id="fTitle" maxlength="60" placeholder="np. Trening, Spotkanie z zespołem…">
    </div>

    <div class="field">
      <label>Kategoria</label>
      <div class="cat-row" id="catRow"></div>
    </div>

    <div class="field">
      <label for="fDate">Data</label>
      <input type="date" id="fDate">
    </div>

    <div class="time-row">
      <div class="field">
        <label for="fStart">Start</label>
        <input type="time" id="fStart" step="60">
      </div>
      <div class="field">
        <label for="fEnd">Koniec</label>
        <input type="time" id="fEnd" step="60">
      </div>
    </div>

    <div class="field">
      <label for="fNotes">Notatka (opcjonalnie)</label>
      <textarea id="fNotes" maxlength="200" placeholder="Dodatkowe informacje…"></textarea>
    </div>

    <div class="error-text" id="errorText"></div>

    <div class="modal-actions">
      <button class="btn-delete" id="deleteBtn" hidden>Usuń wydarzenie</button>
      <div class="btn-group">
        <button class="btn" id="cancelBtn">Anuluj</button>
        <button class="btn btn-primary" id="saveBtn">Zapisz</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CATEGORIES = [
    { id:'habit',         label:'Nawyk',      color:'var(--c-habit)' },
    { id:'entertainment', label:'Rozrywka',   color:'var(--c-entertainment)' },
    { id:'meeting',       label:'Spotkanie',  color:'var(--c-meeting)' },
    { id:'important',     label:'Ważne',      color:'var(--c-important)' },
    { id:'focus',         label:'Skupienie',  color:'var(--c-focus)' }
  ];
  var CAT_MAP = {};
  CATEGORIES.forEach(function(c){ CAT_MAP[c.id] = c; });

  var WEEKDAY_SHORT = ['Pon','Wt','Śr','Czw','Pt','Sob','Nd'];
  var MONTH_SHORT = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];

  var PX_PER_MIN = 1.5;
  var DAY_MIN = 24 * 60;
  var DAY_HEIGHT = DAY_MIN * PX_PER_MIN;

  var state = {
    events: [],
    viewMode: 'day',
    viewDate: todayStr(),
    activeCats: new Set(CATEGORIES.map(function(c){ return c.id; })),
    editingId: null
  };

  // ---------- Date helpers ----------
  function todayStr(){ return fmtDate(new Date()); }
  function fmtDate(d){
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function parseDate(s){ return new Date(s + 'T00:00:00'); }
  function addDays(dateStr, n){
    var d = parseDate(dateStr);
    d.setDate(d.getDate() + n);
    return fmtDate(d);
  }
  function addMonths(dateStr, n){
    var d = parseDate(dateStr);
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    return fmtDate(d);
  }
  function mondayOf(dateStr){
    var d = parseDate(dateStr);
    var dow = (d.getDay() + 6) % 7; // 0 = Monday
    d.setDate(d.getDate() - dow);
    return fmtDate(d);
  }
  function toMinutes(hhmm){ var p = hhmm.split(':'); return (+p[0])*60 + (+p[1]); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function minutesToHHMM(min){
    min = Math.max(0, Math.min(DAY_MIN-1, min));
    return pad2(Math.floor(min/60)) + ':' + pad2(Math.round(min%60));
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // ---------- Storage ----------
  function loadEvents(){
    return window.storage.get('events', false)
      .then(function(res){ state.events = res && res.value ? JSON.parse(res.value) : []; })
      .catch(function(){ state.events = []; });
  }
  function saveEvents(){
    return window.storage.set('events', JSON.stringify(state.events), false)
      .catch(function(err){ console.error('Zapis nie powiódł się', err); });
  }

  // ---------- Element refs ----------
  var els = {
    eyebrow: document.getElementById('eyebrow'),
    dateTitle: document.getElementById('dateTitle'),
    viewSwitch: document.getElementById('viewSwitch'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    todayBtn: document.getElementById('todayBtn'),
    openAdd: document.getElementById('openAdd'),
    liveClock: document.getElementById('liveClock'),
    legend: document.getElementById('legend'),

    dayView: document.getElementById('dayView'),
    dayScroll: document.getElementById('dayScroll'),
    dayRuler: document.getElementById('dayRuler'),
    dayTrack: document.getElementById('dayTrack'),

    weekView: document.getElementById('weekView'),
    weekHeader: document.getElementById('weekHeader'),
    weekScroll: document.getElementById('weekScroll'),
    weekRuler: document.getElementById('weekRuler'),
    weekColumns: document.getElementById('weekColumns'),

    monthView: document.getElementById('monthView'),
    monthWeekdays: document.getElementById('monthWeekdays'),
    monthGrid: document.getElementById('monthGrid'),

    overlay: document.getElementById('overlay'),
    modalTitle: document.getElementById('modalTitle'),
    fTitle: document.getElementById('fTitle'),
    catRow: document.getElementById('catRow'),
    fDate: document.getElementById('fDate'),
    fStart: document.getElementById('fStart'),
    fEnd: document.getElementById('fEnd'),
    fNotes: document.getElementById('fNotes'),
    errorText: document.getElementById('errorText'),
    deleteBtn: document.getElementById('deleteBtn'),
    cancelBtn: document.getElementById('cancelBtn'),
    saveBtn: document.getElementById('saveBtn')
  };

  // ---------- Overlap layout (shared by day + week columns) ----------
  function layoutDayEvents(dayEvents){
    var sorted = dayEvents.slice().sort(function(a,b){ return toMinutes(a.start) - toMinutes(b.start); });
    var clusters = [], current = [], clusterEnd = -1;
    sorted.forEach(function(ev){
      var s = toMinutes(ev.start), e = toMinutes(ev.end);
      if(current.length === 0 || s < clusterEnd){ current.push(ev); clusterEnd = Math.max(clusterEnd, e); }
      else { clusters.push(current); current = [ev]; clusterEnd = e; }
    });
    if(current.length) clusters.push(current);

    var positioned = [];
    clusters.forEach(function(cluster){
      var columns = [], colOf = {};
      cluster.forEach(function(ev){
        var s = toMinutes(ev.start), placed = false;
        for(var c=0; c<columns.length; c++){
          if(columns[c] <= s){ columns[c] = toMinutes(ev.end); colOf[ev.id] = c; placed = true; break; }
        }
        if(!placed){ columns.push(toMinutes(ev.end)); colOf[ev.id] = columns.length - 1; }
      });
      var totalCols = columns.length;
      cluster.forEach(function(ev){ positioned.push(Object.assign({}, ev, { col: colOf[ev.id], totalCols: totalCols })); });
    });
    return positioned;
  }

  function renderRulerInto(el){
    el.innerHTML = '';
    el.style.height = DAY_HEIGHT + 'px';
    for(var h=0; h<24; h++){
      var d = document.createElement('div');
      d.className = 'ruler-hour';
      d.style.top = (h*60*PX_PER_MIN) + 'px';
      d.textContent = pad2(h) + ':00';
      el.appendChild(d);
    }
  }

  function drawGridLines(trackEl){
    for(var h=0; h<24; h++){
      var hl = document.createElement('div');
      hl.className = 'hour-line';
      hl.style.top = (h*60*PX_PER_MIN) + 'px';
      trackEl.appendChild(hl);
      [15,30,45].forEach(function(q){
        var ql = document.createElement('div');
        ql.className = 'quarter-line';
        ql.style.top = ((h*60+q)*PX_PER_MIN) + 'px';
        trackEl.appendChild(ql);
      });
    }
  }

  // renders one date's events+now-line into a track element; compact = smaller text (week view)
  function renderColumn(trackEl, dateStr, compact){
    trackEl.innerHTML = '';
    trackEl.style.height = DAY_HEIGHT + 'px';
    drawGridLines(trackEl);

    var dayEvents = state.events.filter(function(e){ return e.date === dateStr && state.activeCats.has(e.category); });

    if(dayEvents.length === 0 && !compact){
      var empty = document.createElement('div');
      empty.className = 'empty-day';
      empty.innerHTML = '<strong>Pusto w tym dniu</strong>Kliknij na siatkę albo „+ Dodaj wydarzenie”.';
      trackEl.appendChild(empty);
    }

    var positioned = layoutDayEvents(dayEvents);
    positioned.forEach(function(ev){
      var cat = CAT_MAP[ev.category] || CAT_MAP.important;
      var s = toMinutes(ev.start), e = toMinutes(ev.end);
      var top = s * PX_PER_MIN;
      var height = Math.max((e - s) * PX_PER_MIN, compact ? 16 : 20);
      var gap = 2;
      var widthPct = 100 / ev.totalCols;

      var block = document.createElement('div');
      block.className = 'event' + (ev.totalCols > 1 ? ' conflict' : '') + (compact ? ' compact' : '');
      block.style.top = top + 'px';
      block.style.height = height + 'px';
      block.style.left = 'calc(' + (ev.col * widthPct) + '% + ' + (ev.col ? gap : 2) + 'px)';
      block.style.width = 'calc(' + widthPct + '% - ' + (gap + 2) + 'px)';
      block.style.background = cat.color;
      block.setAttribute('tabindex', '0');
      block.setAttribute('role', 'button');
      block.setAttribute('aria-label', ev.title + ', ' + ev.start + '–' + ev.end + ', ' + cat.label);
      block.innerHTML = '<div class="event-title">' + escapeHtml(ev.title) + '</div>' +
                         '<div class="event-time">' + ev.start + '–' + ev.end + '</div>';
      block.addEventListener('click', function(evt){ evt.stopPropagation(); openEdit(ev.id); });
      block.addEventListener('keydown', function(evt){ if(evt.key === 'Enter' || evt.key === ' '){ evt.preventDefault(); openEdit(ev.id); } });
      trackEl.appendChild(block);
    });

    if(dateStr === todayStr()){
      var now = new Date();
      var min = now.getHours()*60 + now.getMinutes();
      var line = document.createElement('div');
      line.className = 'now-line';
      line.style.top = (min * PX_PER_MIN) + 'px';
      var label = document.createElement('span');
      label.className = 'now-label';
      label.textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
      line.appendChild(label);
      trackEl.appendChild(line);
    }

    trackEl.onclick = function(e){
      if(e.target !== trackEl) return;
      var rect = trackEl.getBoundingClientRect();
      var y = e.clientY - rect.top;
      var minutes = Math.round((y / PX_PER_MIN) / 5) * 5;
      openAddModal(dateStr, minutes);
    };
  }

  // ---------- Legend (scope-aware counts) ----------
  function getScopeDates(){
    if(state.viewMode === 'day') return [state.viewDate];
    if(state.viewMode === 'week'){
      var start = mondayOf(state.viewDate), out = [];
      for(var i=0;i<7;i++) out.push(addDays(start,i));
      return out;
    }
    // month: all cells shown in the grid (incl. padding days)
    return monthMatrixDates(state.viewDate);
  }

  function monthMatrixDates(dateStr){
    var d = parseDate(dateStr);
    var first = new Date(d.getFullYear(), d.getMonth(), 1);
    var start = mondayOf(fmtDate(first));
    var dates = [];
    for(var i=0;i<42;i++) dates.push(addDays(start,i));
    return dates;
  }

  function renderLegend(){
    var scope = new Set(getScopeDates());
    els.legend.innerHTML = '';
    CATEGORIES.forEach(function(c){
      var count = state.events.filter(function(e){ return scope.has(e.date) && e.category === c.id; }).length;
      var chip = document.createElement('button');
      chip.className = 'chip' + (state.activeCats.has(c.id) ? '' : ' off');
      chip.setAttribute('type','button');
      chip.innerHTML = '<span class="dot" style="background:'+c.color+'"></span>' + c.label +
        (count ? ' <span class="count">'+count+'</span>' : '');
      chip.addEventListener('click', function(){
        if(state.activeCats.has(c.id)) state.activeCats.delete(c.id); else state.activeCats.add(c.id);
        renderAll();
      });
      els.legend.appendChild(chip);
    });
  }

  // ---------- Header + view switch ----------
  function renderHeader(){
    if(state.viewMode === 'day'){
      els.eyebrow.textContent = 'Twój dzień';
      var d = parseDate(state.viewDate);
      var str = d.toLocaleDateString('pl-PL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
      els.dateTitle.textContent = str.charAt(0).toUpperCase() + str.slice(1);
    } else if(state.viewMode === 'week'){
      els.eyebrow.textContent = 'Twój tydzień';
      var start = mondayOf(state.viewDate);
      var end = addDays(start, 6);
      var sd = parseDate(start), ed = parseDate(end);
      var label = sd.getDate() + ' ' + MONTH_SHORT[sd.getMonth()] + ' – ' + ed.getDate() + ' ' + MONTH_SHORT[ed.getMonth()] + ' ' + ed.getFullYear();
      els.dateTitle.textContent = label;
    } else {
      els.eyebrow.textContent = 'Twój miesiąc';
      var md = parseDate(state.viewDate);
      var mstr = md.toLocaleDateString('pl-PL', { month:'long', year:'numeric' });
      els.dateTitle.textContent = mstr.charAt(0).toUpperCase() + mstr.slice(1);
    }
  }

  els.viewSwitch.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-view]');
    if(!btn) return;
    state.viewMode = btn.getAttribute('data-view');
    Array.prototype.forEach.call(els.viewSwitch.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b === btn);
    });
    renderAll();
  });

  // ---------- View renderers ----------
  function renderDayView(){
    renderRulerInto(els.dayRuler);
    renderColumn(els.dayTrack, state.viewDate, false);
  }

  function renderWeekView(){
    renderRulerInto(els.weekRuler);
    var start = mondayOf(state.viewDate);
    var today = todayStr();

    els.weekHeader.innerHTML = '<div class="spacer"></div>';
    els.weekColumns.innerHTML = '';

    for(var i=0;i<7;i++){
      var dateStr = addDays(start,i);
      var d = parseDate(dateStr);
      var isToday = dateStr === today;

      var head = document.createElement('div');
      head.className = 'day-head' + (isToday ? ' today' : '');
      head.innerHTML = WEEKDAY_SHORT[i] + '<span class="num">' + d.getDate() + '</span>';
      els.weekHeader.appendChild(head);

      var col = document.createElement('div');
      col.className = 'week-col';
      els.weekColumns.appendChild(col);
      renderColumn(col, dateStr, true);
    }
  }

  function renderMonthView(){
    els.monthWeekdays.innerHTML = '';
    WEEKDAY_SHORT.forEach(function(w){
      var el = document.createElement('div');
      el.className = 'month-weekday';
      el.textContent = w;
      els.monthWeekdays.appendChild(el);
    });

    var dates = monthMatrixDates(state.viewDate);
    var refMonth = parseDate(state.viewDate).getMonth();
    var today = todayStr();

    els.monthGrid.innerHTML = '';
    dates.forEach(function(dateStr){
      var d = parseDate(dateStr);
      var outside = d.getMonth() !== refMonth;
      var cell = document.createElement('div');
      cell.className = 'month-cell' + (outside ? ' outside' : '');

      var num = document.createElement('div');
      num.className = 'cell-num' + (dateStr === today ? ' today' : '');
      num.textContent = d.getDate();
      cell.appendChild(num);

      var dayEvents = state.events
        .filter(function(e){ return e.date === dateStr && state.activeCats.has(e.category); })
        .sort(function(a,b){ return toMinutes(a.start) - toMinutes(b.start); });

      var shown = dayEvents.slice(0,3);
      shown.forEach(function(ev){
        var cat = CAT_MAP[ev.category] || CAT_MAP.important;
        var pill = document.createElement('div');
        pill.className = 'cell-pill';
        pill.style.background = cat.color;
        pill.textContent = ev.start + ' ' + ev.title;
        pill.addEventListener('click', function(e){ e.stopPropagation(); openEdit(ev.id); });
        cell.appendChild(pill);
      });
      if(dayEvents.length > 3){
        var more = document.createElement('div');
        more.className = 'cell-more';
        more.textContent = '+' + (dayEvents.length - 3) + ' więcej';
        cell.appendChild(more);
      }

      cell.addEventListener('click', function(){
        state.viewDate = this.getAttribute('data-date');
        state.viewMode = 'day';
        Array.prototype.forEach.call(els.viewSwitch.querySelectorAll('button'), function(b){
          b.classList.toggle('active', b.getAttribute('data-view') === 'day');
        });
        renderAll();
        scrollToNow();
      });
      cell.setAttribute('data-date', dateStr);

      els.monthGrid.appendChild(cell);
    });
  }

  function renderAll(){
    renderHeader();
    renderLegend();

    els.dayView.hidden = state.viewMode !== 'day';
    els.weekView.hidden = state.viewMode !== 'week';
    els.monthView.hidden = state.viewMode !== 'month';

    if(state.viewMode === 'day') renderDayView();
    else if(state.viewMode === 'week') renderWeekView();
    else renderMonthView();
  }

  // ---------- Navigation ----------
  function shift(delta){
    if(state.viewMode === 'day') state.viewDate = addDays(state.viewDate, delta);
    else if(state.viewMode === 'week') state.viewDate = addDays(state.viewDate, delta*7);
    else state.viewDate = addMonths(state.viewDate, delta);
    renderAll();
  }
  els.prevBtn.addEventListener('click', function(){ shift(-1); });
  els.nextBtn.addEventListener('click', function(){ shift(1); });
  els.todayBtn.addEventListener('click', function(){ state.viewDate = todayStr(); renderAll(); scrollToNow(); });

  function scrollToNow(){
    if(state.viewMode === 'month') return;
    var now = new Date();
    var min = now.getHours()*60 + now.getMinutes();
    var top = Math.max(0, min * PX_PER_MIN - 200);
    var target = state.viewMode === 'day' ? els.dayScroll : els.weekScroll;
    target.scrollTop = top;
  }

  // ---------- Live clock ----------
  function tickClock(){
    var now = new Date();
    els.liveClock.textContent = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    if(state.viewMode !== 'month'){
      var visibleDate = state.viewMode === 'day' ? state.viewDate : null;
      if(state.viewMode === 'day') renderColumn(els.dayTrack, state.viewDate, false);
      else renderWeekView();
    }
  }
  setInterval(tickClock, 30000);

  // ---------- Modal ----------
  var selectedCat = 'meeting';

  function renderCatRow(){
    els.catRow.innerHTML = '';
    CATEGORIES.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat-btn' + (selectedCat === c.id ? ' active' : '');
      b.innerHTML = '<span class="dot" style="background:'+c.color+'"></span>' + c.label;
      b.addEventListener('click', function(){ selectedCat = c.id; renderCatRow(); });
      els.catRow.appendChild(b);
    });
  }

  function openAddModal(dateStr, prefillStart){
    state.editingId = null;
    els.modalTitle.textContent = 'Nowe wydarzenie';
    els.fTitle.value = '';
    els.fNotes.value = '';
    selectedCat = 'meeting';
    var start = prefillStart != null ? prefillStart : 9*60;
    els.fDate.value = dateStr || state.viewDate;
    els.fStart.value = minutesToHHMM(start);
    els.fEnd.value = minutesToHHMM(Math.min(start+30, DAY_MIN-1));
    els.deleteBtn.hidden = true;
    els.errorText.textContent = '';
    renderCatRow();
    els.overlay.hidden = false;
    els.fTitle.focus();
  }

  function openEdit(id){
    var ev = state.events.find(function(e){ return e.id === id; });
    if(!ev) return;
    state.editingId = id;
    els.modalTitle.textContent = 'Edytuj wydarzenie';
    els.fTitle.value = ev.title;
    els.fNotes.value = ev.notes || '';
    selectedCat = ev.category;
    els.fDate.value = ev.date;
    els.fStart.value = ev.start;
    els.fEnd.value = ev.end;
    els.deleteBtn.hidden = false;
    els.errorText.textContent = '';
    renderCatRow();
    els.overlay.hidden = false;
    els.fTitle.focus();
  }

  function closeModal(){ els.overlay.hidden = true; }

  els.openAdd.addEventListener('click', function(){ openAddModal(state.viewDate, 9*60); });
  els.cancelBtn.addEventListener('click', closeModal);
  els.overlay.addEventListener('click', function(e){ if(e.target === els.overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !els.overlay.hidden) closeModal(); });

  els.saveBtn.addEventListener('click', function(){
    var title = els.fTitle.value.trim();
    var date = els.fDate.value;
    var start = els.fStart.value;
    var end = els.fEnd.value;

    if(!title){ els.errorText.textContent = 'Podaj nazwę wydarzenia.'; els.fTitle.focus(); return; }
    if(!date){ els.errorText.textContent = 'Podaj datę.'; return; }
    if(!start || !end){ els.errorText.textContent = 'Podaj godzinę startu i końca.'; return; }
    if(toMinutes(end) <= toMinutes(start)){ els.errorText.textContent = 'Koniec musi być późniejszy niż start.'; return; }

    if(state.editingId){
      var ev = state.events.find(function(e){ return e.id === state.editingId; });
      ev.title = title; ev.category = selectedCat; ev.date = date; ev.start = start; ev.end = end; ev.notes = els.fNotes.value.trim();
    } else {
      state.events.push({ id: uid(), date: date, title: title, category: selectedCat, start: start, end: end, notes: els.fNotes.value.trim() });
    }
    saveEvents();
    closeModal();
    renderAll();
  });

  els.deleteBtn.addEventListener('click', function(){
    state.events = state.events.filter(function(e){ return e.id !== state.editingId; });
    saveEvents();
    closeModal();
    renderAll();
  });

  // ---------- Init ----------
  loadEvents().then(function(){
    renderAll();
    scrollToNow();
    tickClock();
  });

})();
</script>
</body>
</html>
