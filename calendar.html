<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendarz — Asystent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E15;
    --panel:#161B27;
    --panel-raised:#1E2433;
    --panel-sunken:#101420;
    --border:#2A3142;
    --border-soft:#232939;
    --text:#EDEFF4;
    --text-muted:#8890A6;
    --text-faint:#586079;
    --brass:#CDA349;
    --brass-dim:#8A7237;
    --danger:#E0785B;

    --c-habit:#5FB88A;
    --c-entertainment:#A98CE0;
    --c-meeting:#5B9BE0;
    --c-important:#E0785B;
    --c-focus:#3FB8B0;

    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;

    --px-per-min: 1.35;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(205,163,73,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ===================== APP SHELL — whole page, 3 columns: notes/reminders | calendar | chat ===================== */
  .app-shell{
    width:100vw;
    height:100vh;
    min-width:920px;
    min-height:560px;
    background:var(--panel);
    position:relative;
    display:grid;
    grid-template-columns: 240px minmax(0,1fr) 320px;
    grid-template-rows: 100%;
    overflow:hidden;
  }

  /* ===================== LEFT COLUMN — reminders (top) + notes (bottom) ===================== */
  .left-col{
    grid-column:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--border);
    background:var(--panel);
    height:100%;
    min-height:0;
  }

  .left-col section{
    display:flex;
    flex-direction:column;
    min-height:0;
    border-bottom:1px solid var(--border-soft);
  }
  .left-col section:last-child{ border-bottom:none; }

  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px 8px;
    flex:none;
  }
  .panel-eyebrow{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--brass); display:flex; align-items:center; gap:6px;
  }
  .panel-eyebrow .dot{ width:5px; height:5px; border-radius:50%; background:var(--brass); }
  .panel-title{
    font-family:var(--font-display); font-size:15px; font-weight:500; margin:2px 0 0;
    font-variation-settings:'opsz' 14;
  }
  .mini-add{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel-raised); color:var(--text-muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1;
    flex:none;
  }
  .mini-add:hover{ color:var(--text); border-color:var(--brass-dim); }
  .mini-add:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }

  .rem-panel{ flex:1 1 0; }
  .note-panel{ flex:1.3 1 0; }

  /* --- Calendar panel (now the big center column) --- */
  .center-col{
    grid-column:2;
    min-width:0;
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:0;
    border-right:1px solid var(--border);
    background:var(--panel);
  }
  .center-col .panel-head{ padding:18px 22px 10px; }
  .center-col .panel-title{ font-size:22px; }
  .center-col .cal-nav{ padding:0 22px 12px; font-size:12px; }
  .cal-nav{
    display:flex; align-items:center; gap:6px; padding:0 12px 8px;
    font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); flex:none;
  }
  .cal-nav button{
    width:20px; height:20px; border-radius:5px; border:1px solid var(--border);
    background:var(--panel-raised); color:var(--text-muted); cursor:pointer; font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-nav button:hover{ color:var(--text); border-color:var(--brass-dim); }
  .cal-nav .cal-date{ color:var(--text); flex:1; text-align:center; }
  .cal-nav .today-pill{
    font-size:9.5px; padding:2px 6px; border-radius:5px; border:1px solid var(--border);
    background:transparent; color:var(--text-faint); cursor:pointer;
  }
  .cal-nav .today-pill:hover{ color:var(--brass); border-color:var(--brass-dim); }

  .cal-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }
  .cal-grid{ display:flex; position:relative; }
  .cal-ruler{ flex:none; width:36px; position:relative; border-right:1px solid var(--border); }
  .cal-ruler-hour{
    position:absolute; left:0; right:0; transform:translateY(-50%);
    font-family:var(--font-mono); font-size:8.5px; color:var(--text-faint);
    text-align:right; padding-right:5px;
  }
  .cal-track{ flex:1; position:relative; cursor:crosshair; min-width:0; }
  .hour-line{ position:absolute; left:0; right:0; border-top:1px solid var(--border-soft); }
  .now-line{ position:absolute; left:0; right:0; height:0; border-top:1.5px solid var(--brass); z-index:5; pointer-events:none; }
  .now-line::before{ content:''; position:absolute; left:-3px; top:-3px; width:6px; height:6px; border-radius:50%; background:var(--brass); }

  .cal-event{
    position:absolute; border-radius:6px; padding:3px 6px; overflow:hidden; cursor:pointer;
    border:1px solid rgba(12,15,22,0.28); box-shadow:0 2px 6px -2px rgba(0,0,0,0.5);
    box-sizing:border-box;
  }
  .cal-event:hover{ filter:brightness(1.12); z-index:6; box-shadow:0 4px 12px -3px rgba(0,0,0,0.6); }
  .cal-event-title{ font-size:10.5px; font-weight:600; color:#0C0F16; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-event-time{ font-family:var(--font-mono); font-size:8px; color:rgba(12,15,22,0.72); }

  .cal-empty{ padding:26px 14px; text-align:center; color:var(--text-faint); font-size:11.5px; }

  .cal-drag-preview{
    position:absolute; left:2px; right:3px; border-radius:6px;
    background:rgba(205,163,73,0.22); border:1.5px dashed var(--brass);
    pointer-events:none; z-index:4;
  }
  .cal-drag-preview .cal-drag-label{
    position:absolute; top:2px; left:6px; font-family:var(--font-mono); font-size:9.5px; color:var(--brass);
    white-space:nowrap;
  }

  /* --- Reminders list --- */
  .side-list{ flex:1; overflow-y:auto; padding:4px 10px 10px; display:flex; flex-direction:column; gap:6px; }
  .rem-item{
    background:var(--panel-raised); border:1px solid var(--border-soft); border-radius:9px;
    padding:7px 9px; cursor:pointer; display:flex; align-items:flex-start; gap:7px;
  }
  .rem-item:hover{ border-color:var(--brass-dim); }
  .rem-check{
    width:14px; height:14px; border-radius:4px; border:1.5px solid var(--text-faint);
    flex:none; margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .rem-check.done{ background:var(--brass); border-color:var(--brass); }
  .rem-check.done::after{ content:'✓'; font-size:9px; color:#1A1508; font-weight:700; }
  .rem-body{ min-width:0; flex:1; }
  .rem-time{ font-family:var(--font-mono); font-size:9px; color:var(--brass); }
  .rem-text{ font-size:12px; color:var(--text); line-height:1.3; }
  .side-empty{ padding:14px 4px; text-align:center; color:var(--text-faint); font-size:11px; }

  /* --- Notes list — distinct card style: brass accent spine, header row, bigger snippet --- */
  .note-item{
    background:linear-gradient(160deg, var(--panel-raised), var(--panel-sunken));
    border:1px solid var(--border-soft); border-left:3px solid var(--brass-dim);
    border-radius:8px; padding:9px 11px 10px; cursor:pointer;
    display:flex; flex-direction:column; gap:3px;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .note-item:hover{
    border-color:var(--brass-dim); border-left-color:var(--brass);
    transform:translateY(-1px); box-shadow:0 8px 18px -10px rgba(0,0,0,0.6);
  }
  .note-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .note-title{ font-family:var(--font-display); font-size:13px; font-weight:600; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note-time{ font-family:var(--font-mono); font-size:8.5px; color:var(--text-faint); flex:none; }
  .note-snippet{ font-size:11.5px; color:var(--text-muted); line-height:1.42; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .note-snippet:empty::before{ content:'Brak treści'; color:var(--text-faint); font-style:italic; }

  /* ===================== RIGHT COLUMN — collapsible chat sidebar ===================== */
  .right-col{
    grid-column:3;
    min-width:0;
    position:relative;
    overflow:hidden;
    display:flex; flex-direction:column;
    height:100%;
    background:
      radial-gradient(500px 300px at 80% 20%, rgba(205,163,73,0.05), transparent),
      var(--panel-sunken);
    transition:opacity .18s ease;
  }
  .app-shell.chat-collapsed{ grid-template-columns: 240px minmax(0,1fr) 0px; }
  .app-shell.chat-collapsed .right-col{ opacity:0; pointer-events:none; }

  .chat-tab{
    position:absolute; top:50%; right:320px; transform:translateY(-50%);
    width:22px; height:74px; border-radius:8px 0 0 8px;
    background:var(--panel-raised); border:1px solid var(--border); border-right:none;
    color:var(--text-muted); cursor:pointer; z-index:50;
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; font-family:var(--font-mono); font-size:10px; letter-spacing:.08em;
    gap:6px; transition:right .18s ease;
  }
  .chat-tab:hover{ color:var(--brass); border-color:var(--brass-dim); }
  .chat-tab:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }
  .chat-tab .chevron{ writing-mode:horizontal-tb; font-size:11px; }
  .app-shell.chat-collapsed .chat-tab{ right:0; }

  .chat-panel-head{
    flex:none; padding:14px 44px 12px 18px; border-bottom:1px solid var(--border-soft);
    display:flex; flex-direction:column; gap:2px;
  }
  .chat-panel-head .eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass); }
  .chat-panel-head .title{ font-family:var(--font-display); font-size:18px; font-weight:500; }

  .chat-log{ flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
  .msg{ max-width:78%; display:flex; flex-direction:column; gap:3px; }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.assistant{ align-self:flex-start; align-items:flex-start; }
  .msg-bubble{ padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.42; white-space:pre-wrap; }
  .msg.user .msg-bubble{ background:var(--brass); color:#1A1508; border-bottom-right-radius:4px; }
  .msg.assistant .msg-bubble{ background:var(--panel-raised); border:1px solid var(--border-soft); color:var(--text); border-bottom-left-radius:4px; }
  .msg-time{ font-family:var(--font-mono); font-size:9.5px; color:var(--text-faint); padding:0 3px; }
  .msg.assistant.typing .msg-bubble{ color:var(--text-faint); font-style:italic; }

  .chat-log-empty{ margin:auto; text-align:center; color:var(--text-faint); font-size:12.5px; padding:0 30px; }

  /* ===================== BOTTOM-CENTER COMPOSER ===================== */
  .composer{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; z-index:40;
  }

  .voice-btn{
    width:44px; height:44px; border-radius:50%; flex:none;
    background:var(--panel-raised); border:1px solid var(--border);
    color:var(--text-muted); cursor:pointer; font-size:17px;
    display:flex; align-items:center; justify-content:center;
    position:relative; transition:border-color .15s, color .15s, transform .15s;
  }
  .voice-btn:hover{ color:var(--brass); border-color:var(--brass-dim); transform:translateY(-1px); }
  .voice-btn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .voice-btn::after{
    content:''; position:absolute; inset:-5px; border-radius:50%; border:1px solid var(--brass-dim);
    opacity:0; transition:opacity .2s;
  }
  .voice-btn:hover::after{ opacity:.5; }
  .voice-btn.active{ color:#1A1508; background:var(--brass); border-color:var(--brass); }

  .text-bubble{
    height:44px; width:44px; border-radius:22px; overflow:hidden;
    background:var(--panel-raised); border:1px solid var(--border);
    display:flex; align-items:center;
    transition:width .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1), border-color .2s;
    cursor:text;
  }
  .text-bubble:hover, .text-bubble.focused{
    width:min(46vw, 460px); height:52px; border-color:var(--brass-dim);
  }
  .text-bubble .bubble-icon{
    flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--brass); pointer-events:none;
  }
  .text-bubble input{
    flex:1; min-width:0; height:100%; background:transparent; border:none; outline:none;
    color:var(--text); font-family:var(--font-body); font-size:13.5px; padding-right:14px;
    opacity:0; transition:opacity .22s ease .06s;
  }
  .text-bubble:hover input, .text-bubble.focused input{ opacity:1; }
  .text-bubble input::placeholder{ color:var(--text-faint); }

  /* ===================== connection banner + modal ===================== */
  .conn-banner{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(224,120,91,0.14); border:1px solid var(--danger); color:#F3C7B8;
    font-family:var(--font-mono); font-size:11px; padding:6px 12px; border-radius:8px;
    z-index:60; max-width:80%; text-align:center;
  }
  .conn-banner code{ background:rgba(0,0,0,0.25); padding:1px 5px; border-radius:4px; }
  .conn-banner[hidden]{ display:none; }

  .overlay{
    position:fixed; inset:0; background:rgba(6,8,13,0.6);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .overlay[hidden]{ display:none; }
  .modal{
    width:100%; max-width:380px; background:var(--panel-raised); border:1px solid var(--border);
    border-radius:14px; padding:22px; font-family:var(--font-body); color:var(--text);
  }
  .modal.wide{ max-width:600px; }
  .modal h2{ font-family:var(--font-display); font-weight:500; font-size:19px; margin:0 0 14px; }
  .mf-field{ margin-bottom:12px; }
  .mf-field label{
    display:block; font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:5px; font-family:var(--font-mono);
  }
  .mf-input, .mf-textarea{
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; color:var(--text); font-family:var(--font-body); font-size:13.5px;
    box-sizing:border-box;
  }
  .mf-input.mono{ font-family:var(--font-mono); }
  .mf-textarea{ min-height:80px; resize:vertical; }
  .mf-textarea.large{ min-height:min(48vh, 380px); line-height:1.5; }
  .mf-row{ display:flex; gap:10px; }
  .mf-row .mf-field{ flex:1; }
  .cat-btn{
    display:flex; align-items:center; gap:5px; padding:6px 10px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text-muted);
    font-size:12px; cursor:pointer;
  }
  .cat-btn.active{ border-color:var(--brass); background:#232A3C; color:var(--text); }
  .cat-dot{ width:7px; height:7px; border-radius:50%; }
  .error-text{ color:var(--danger); font-size:12px; margin:2px 0 10px; min-height:14px; }
  .btn{
    font-family:var(--font-body); font-size:13px; font-weight:600; padding:9px 16px;
    border-radius:8px; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text-muted);
  }
  .btn:hover{ color:var(--text); border-color:var(--brass-dim); }
  .btn-primary{ background:var(--brass); border-color:var(--brass); color:#1A1508; }
  .btn-primary:hover{ background:#DCB35A; color:#1A1508; }
  .btn-delete{ background:transparent; border:none; color:var(--danger); font-size:12.5px; cursor:pointer; padding:9px 4px; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  @media (max-width:900px){
    .app-shell{
      width:100vw; height:100vh; min-width:0;
      grid-template-columns:1fr;
      grid-template-rows: 28% 46% 26%;
    }
    .left-col{ grid-column:1; grid-row:1; border-right:none; border-bottom:1px solid var(--border); flex-direction:row; }
    .left-col section{ border-bottom:none; border-right:1px solid var(--border-soft); flex:1; }
    .center-col{ grid-column:1; grid-row:2; border-right:none; border-bottom:1px solid var(--border); }
    .right-col{ grid-column:1; grid-row:3; }
    .chat-tab{ display:none; }
    .text-bubble:hover, .text-bubble.focused{ width:min(70vw, 420px); }
  }
</style>
</head>
<body>

<div class="app-shell" id="appShell">

  <div class="conn-banner" id="connBanner" hidden>
    Backend niedostępny — uruchom: <code>uvicorn main:app --reload --port 8000</code>
  </div>

  <!-- ===================== LEFT COLUMN — reminders + notes ===================== -->
  <div class="left-col">

    <section class="rem-panel">
      <div class="panel-head">
        <div>
          <div class="panel-eyebrow"><span class="dot"></span>Dziś</div>
          <div class="panel-title">Przypomnienia</div>
        </div>
        <button class="mini-add" id="addReminderBtn" title="Dodaj przypomnienie">+</button>
      </div>
      <div class="side-list" id="reminderList"></div>
    </section>

    <section class="note-panel">
      <div class="panel-head">
        <div>
          <div class="panel-eyebrow"><span class="dot"></span>Notatnik</div>
          <div class="panel-title">Notatki</div>
        </div>
        <button class="mini-add" id="addNoteBtn" title="Dodaj notatkę">+</button>
      </div>
      <div class="side-list" id="noteList"></div>
    </section>

  </div>

  <!-- ===================== CENTER COLUMN — calendar ===================== -->
  <div class="center-col">
    <div class="panel-head">
      <div>
        <div class="panel-eyebrow"><span class="dot"></span>Kalendarz</div>
        <div class="panel-title" id="calTitle">—</div>
      </div>
      <button class="mini-add" id="addEventBtn" title="Dodaj wydarzenie">+</button>
    </div>
    <div class="cal-nav">
      <button id="calPrev">‹</button>
      <span class="cal-date" id="calDateLabel">—</span>
      <button id="calNext">›</button>
      <button class="today-pill" id="calToday">dziś</button>
    </div>
    <div class="cal-scroll" id="calScroll">
      <div class="cal-grid">
        <div class="cal-ruler" id="calRuler"></div>
        <div class="cal-track" id="calTrack"></div>
      </div>
    </div>
  </div>

  <!-- ===================== RIGHT COLUMN — chat sidebar ===================== -->
  <button class="chat-tab" id="chatTab"><span class="chevron">›</span> Czat</button>
  <div class="right-col" id="chatPanel">
    <div class="chat-panel-head">
      <span class="eyebrow">Asystent</span>
      <span class="title">Czat</span>
    </div>
    <div class="chat-log" id="chatLog">
      <div class="chat-log-empty" id="chatLogEmpty">Brak wiadomości. Napisz coś w polu na dole ekranu.</div>
    </div>
  </div>

  <!-- ===================== BOTTOM-CENTER COMPOSER ===================== -->
  <div class="composer">
    <div class="text-bubble" id="textBubble">
      <span class="bubble-icon">✎</span>
      <input type="text" id="composerInput" placeholder="Napisz do asystenta i naciśnij Enter…" maxlength="500">
    </div>
    <button class="voice-btn" id="voiceBtn" title="Rozmowa głosowa (wkrótce)">🎙</button>
  </div>

</div>

<!-- ===================== GENERIC MODAL (event / reminder / note) ===================== -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalBox">
    <h2 id="modalTitle">Nowy wpis</h2>
    <div id="modalFields"></div>
    <div class="error-text" id="errorText"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px;">
      <button id="deleteBtn" class="btn-delete" hidden>Usuń</button>
      <div style="display:flex;gap:8px;margin-left:auto;">
        <button id="cancelBtn" class="btn">Anuluj</button>
        <button id="saveBtn" class="btn btn-primary">Zapisz</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Point this at wherever backend/main.py is running.
  var API_BASE = "http://localhost:8000";

  var CATEGORIES = [
    { id:'habit',         label:'Nawyk' },
    { id:'entertainment', label:'Rozrywka' },
    { id:'meeting',       label:'Spotkanie' },
    { id:'important',     label:'Ważne' },
    { id:'focus',         label:'Skupienie' }
  ];
  var CAT_COLOR = {
    habit:'#5FB88A', entertainment:'#A98CE0', meeting:'#5B9BE0', important:'#E0785B', focus:'#3FB8B0'
  };

  var PX_PER_MIN = 1.35;
  var DAY_MIN = 24*60;
  var DAY_HEIGHT = DAY_MIN * PX_PER_MIN;

  var state = { events: [], reminders: [], notes: [], chat: [], calDate: todayStr(), editing: null };

  function todayStr(){ return fmtDate(new Date()); }
  function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function parseDate(s){ return new Date(s+'T00:00:00'); }
  function addDays(s,n){ var d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
  function toMinutes(hhmm){ var p=hhmm.split(':'); return (+p[0])*60+(+p[1]); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function nowHHMM(){ var d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  function minutesToHHMM(min){ min=Math.max(0,Math.min(DAY_MIN-1,min)); return pad2(Math.floor(min/60))+':'+pad2(Math.round(min%60)); }
  function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  // ---------- API ----------
  function showConnBanner(show){ document.getElementById('connBanner').hidden = !show; }

  function apiGet(path){
    return fetch(API_BASE+path).then(function(r){
      if(!r.ok) throw new Error('API '+r.status);
      showConnBanner(false);
      return r.json();
    }).catch(function(e){ showConnBanner(true); throw e; });
  }
  function apiSend(path, method, body){
    return fetch(API_BASE+path, {
      method: method,
      headers: {'Content-Type':'application/json'},
      body: body!==undefined ? JSON.stringify(body) : undefined
    }).then(function(r){
      if(!r.ok) throw new Error('API '+r.status);
      showConnBanner(false);
      return r.json();
    }).catch(function(e){ showConnBanner(true); throw e; });
  }
  function apiPost(path, body){ return apiSend(path, 'POST', body); }
  function apiPut(path, body){ return apiSend(path, 'PUT', body); }
  function apiDelete(path){ return apiSend(path, 'DELETE'); }

  var els = {
    calTitle: document.getElementById('calTitle'),
    calDateLabel: document.getElementById('calDateLabel'),
    calRuler: document.getElementById('calRuler'),
    calTrack: document.getElementById('calTrack'),
    calScroll: document.getElementById('calScroll'),
    reminderList: document.getElementById('reminderList'),
    noteList: document.getElementById('noteList'),
    chatLog: document.getElementById('chatLog'),
    chatLogEmpty: document.getElementById('chatLogEmpty'),
    chatPanel: document.getElementById('chatPanel'),
    chatTab: document.getElementById('chatTab'),
    appShell: document.getElementById('appShell'),
    composerInput: document.getElementById('composerInput'),
    textBubble: document.getElementById('textBubble'),
    voiceBtn: document.getElementById('voiceBtn')
  };

  // ================= CALENDAR (day view) =================
  function renderRuler(){
    els.calRuler.innerHTML='';
    els.calRuler.style.height = DAY_HEIGHT+'px';
    for(var h=0;h<24;h++){
      var d=document.createElement('div');
      d.className='cal-ruler-hour';
      d.style.top=(h*60*PX_PER_MIN)+'px';
      d.textContent=pad2(h)+':00';
      els.calRuler.appendChild(d);
    }
  }

  function layoutDayEvents(dayEvents){
    var sorted = dayEvents.slice().sort(function(a,b){ return toMinutes(a.start)-toMinutes(b.start); });
    var clusters=[], current=[], clusterEnd=-1;
    sorted.forEach(function(ev){
      var s=toMinutes(ev.start), e=toMinutes(ev.end);
      if(current.length===0||s<clusterEnd){ current.push(ev); clusterEnd=Math.max(clusterEnd,e); }
      else { clusters.push(current); current=[ev]; clusterEnd=e; }
    });
    if(current.length) clusters.push(current);
    var positioned=[];
    clusters.forEach(function(cluster){
      var columns=[], colOf={};
      cluster.forEach(function(ev){
        var s=toMinutes(ev.start), placed=false;
        for(var c=0;c<columns.length;c++){
          if(columns[c]<=s){ columns[c]=toMinutes(ev.end); colOf[ev.id]=c; placed=true; break; }
        }
        if(!placed){ columns.push(toMinutes(ev.end)); colOf[ev.id]=columns.length-1; }
      });
      var totalCols=columns.length;
      cluster.forEach(function(ev){ positioned.push(Object.assign({},ev,{col:colOf[ev.id],totalCols:totalCols})); });
    });
    return positioned;
  }

  function renderCalendar(){
    var d = parseDate(state.calDate);
    var str = d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
    els.calTitle.textContent = str.charAt(0).toUpperCase()+str.slice(1);
    els.calDateLabel.textContent = d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});

    renderRuler();
    els.calTrack.innerHTML='';
    els.calTrack.style.height = DAY_HEIGHT+'px';
    for(var h=0;h<24;h++){
      var hl=document.createElement('div');
      hl.className='hour-line';
      hl.style.top=(h*60*PX_PER_MIN)+'px';
      els.calTrack.appendChild(hl);
    }

    var dayEvents = state.events.filter(function(e){ return e.date===state.calDate; });
    if(dayEvents.length===0){
      var empty=document.createElement('div');
      empty.className='cal-empty';
      empty.textContent='Brak wydarzeń — kliknij siatkę, aby dodać.';
      empty.style.position='absolute'; empty.style.top='40px'; empty.style.left='0'; empty.style.right='0';
      els.calTrack.appendChild(empty);
    }

    layoutDayEvents(dayEvents).forEach(function(ev){
      var color = CAT_COLOR[ev.category]||CAT_COLOR.important;
      var s=toMinutes(ev.start), e=toMinutes(ev.end);
      var top=s*PX_PER_MIN, height=Math.max((e-s)*PX_PER_MIN,16);
      var widthPct=100/ev.totalCols;
      var block=document.createElement('div');
      block.className='cal-event';
      block.style.top=top+'px'; block.style.height=height+'px';
      block.style.left='calc('+(ev.col*widthPct)+'% + '+(ev.col?4:2)+'px)';
      block.style.width='calc('+widthPct+'% - 7px)';
      block.style.background=color;
      block.innerHTML='<div class="cal-event-title">'+escapeHtml(ev.title)+'</div><div class="cal-event-time">'+ev.start+'–'+ev.end+'</div>';
      block.addEventListener('click',function(evt){ evt.stopPropagation(); openEventModal(ev.id); });
      els.calTrack.appendChild(block);
    });

    if(state.calDate===todayStr()){
      var now=new Date(); var min=now.getHours()*60+now.getMinutes();
      var line=document.createElement('div');
      line.className='now-line';
      line.style.top=(min*PX_PER_MIN)+'px';
      els.calTrack.appendChild(line);
    }

  }

  // ---- click-and-drag on the calendar track to size a new event ----
  function bindTrackDrag(track){
    var dragging=false, startMin=0, preview=null, moved=false;

    function yToMin(clientY){
      var rect=track.getBoundingClientRect();
      var y=clientY-rect.top+track.scrollTop*0; // track itself isn't scrolled, cal-scroll is
      var minutes=Math.round((y/PX_PER_MIN)/5)*5;
      return Math.max(0, Math.min(DAY_MIN, minutes));
    }

    function updatePreview(aMin,bMin){
      var s=Math.min(aMin,bMin), e=Math.max(aMin,bMin,s+5);
      if(!preview){
        preview=document.createElement('div');
        preview.className='cal-drag-preview';
        preview.innerHTML='<span class="cal-drag-label"></span>';
        track.appendChild(preview);
      }
      preview.style.top=(s*PX_PER_MIN)+'px';
      preview.style.height=Math.max((e-s)*PX_PER_MIN,16)+'px';
      preview.querySelector('.cal-drag-label').textContent = minutesToHHMM(s)+'–'+minutesToHHMM(e);
    }

    function removePreview(){
      if(preview){ preview.remove(); preview=null; }
    }

    track.addEventListener('mousedown', function(e){
      if(e.target!==track) return;
      dragging=true; moved=false;
      startMin=yToMin(e.clientY);
      e.preventDefault();
    });

    document.addEventListener('mousemove', function(e){
      if(!dragging) return;
      var curMin=yToMin(e.clientY);
      if(Math.abs(curMin-startMin)>=5) moved=true;
      updatePreview(startMin,curMin);
    });

    document.addEventListener('mouseup', function(e){
      if(!dragging) return;
      dragging=false;
      var endMin=yToMin(e.clientY);
      removePreview();
      if(moved){
        var s=Math.min(startMin,endMin), en=Math.max(startMin,endMin,s+5);
        openEventModal(null, s, en);
      } else {
        openEventModal(null, startMin);
      }
    });
  }
  bindTrackDrag(els.calTrack);

  function scrollToNow(){
    if(state.calDate!==todayStr()) return;
    var now=new Date(); var min=now.getHours()*60+now.getMinutes();
    els.calScroll.scrollTop = Math.max(0, min*PX_PER_MIN - 160);
  }

  document.getElementById('calPrev').addEventListener('click',function(){ state.calDate=addDays(state.calDate,-1); reloadEvents(); });
  document.getElementById('calNext').addEventListener('click',function(){ state.calDate=addDays(state.calDate,1); reloadEvents(); });
  document.getElementById('calToday').addEventListener('click',function(){ state.calDate=todayStr(); reloadEvents().then(scrollToNow); });
  document.getElementById('addEventBtn').addEventListener('click',function(){ openEventModal(null, 9*60); });

  function reloadEvents(){
    return apiGet('/api/events').then(function(rows){ state.events = rows; renderCalendar(); })
      .catch(function(){ renderCalendar(); });
  }

  // ================= REMINDERS =================
  function renderReminders(){
    var today = todayStr();
    var todays = state.reminders
      .filter(function(r){ return r.date===today && !r.done; })
      .sort(function(a,b){ return toMinutes(a.time)-toMinutes(b.time); });

    els.reminderList.innerHTML='';
    if(todays.length===0){
      els.reminderList.innerHTML='<div class="side-empty">Brak przypomnień na dziś.</div>';
      return;
    }
    todays.forEach(function(r){
      var item=document.createElement('div');
      item.className='rem-item';
      item.innerHTML =
        '<span class="rem-check" data-id="'+r.id+'"></span>'+
        '<span class="rem-body"><span class="rem-time">'+r.time+'</span><br><span class="rem-text">'+escapeHtml(r.text)+'</span></span>';
      item.querySelector('.rem-check').addEventListener('click',function(e){
        e.stopPropagation();
        apiPut('/api/reminders/'+r.id, {done: !r.done}).then(reloadReminders).catch(function(){});
      });
      item.addEventListener('click',function(){ openReminderModal(r.id); });
      els.reminderList.appendChild(item);
    });
  }
  document.getElementById('addReminderBtn').addEventListener('click',function(){ openReminderModal(null); });

  function reloadReminders(){
    return apiGet('/api/reminders').then(function(rows){ state.reminders = rows; renderReminders(); })
      .catch(function(){ renderReminders(); });
  }

  // ================= NOTES =================
  function formatNoteTime(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    var sameDay = d.toDateString()===new Date().toDateString();
    var time = d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
    if(sameDay) return time;
    return d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})+' '+time;
  }

  function renderNotes(){
    els.noteList.innerHTML='';
    if(state.notes.length===0){
      els.noteList.innerHTML='<div class="side-empty">Brak notatek.</div>';
      return;
    }
    var sorted = state.notes.slice().sort(function(a,b){
      return (b.updated_at||'').localeCompare(a.updated_at||'');
    });
    sorted.forEach(function(n){
      var item=document.createElement('div');
      item.className='note-item';
      item.innerHTML=
        '<div class="note-head">'+
          '<span class="note-title">'+escapeHtml(n.title||'Bez tytułu')+'</span>'+
          '<span class="note-time">'+formatNoteTime(n.updated_at)+'</span>'+
        '</div>'+
        '<div class="note-snippet">'+escapeHtml(n.content||'')+'</div>';
      item.addEventListener('click',function(){ openNoteModal(n.id); });
      els.noteList.appendChild(item);
    });
  }
  document.getElementById('addNoteBtn').addEventListener('click',function(){ openNoteModal(null); });

  function reloadNotes(){
    return apiGet('/api/notes').then(function(rows){ state.notes = rows; renderNotes(); })
      .catch(function(){ renderNotes(); });
  }

  // ================= GENERIC MODAL =================
  var overlay=document.getElementById('overlay');
  var modalBox=document.getElementById('modalBox');
  var modalTitle=document.getElementById('modalTitle');
  var modalFields=document.getElementById('modalFields');
  var errorText=document.getElementById('errorText');
  var deleteBtn=document.getElementById('deleteBtn');
  var saveBtn=document.getElementById('saveBtn');
  var cancelBtn=document.getElementById('cancelBtn');
  var modalKind=null;
  var selectedCat='meeting';

  function fieldHTML(label, inner){
    return '<div class="mf-field"><label>'+label+'</label>'+inner+'</div>';
  }

  function openEventModal(id, prefillStart, prefillEnd){
    modalKind='event'; state.editing=id;
    modalTitle.textContent = id? 'Edytuj wydarzenie':'Nowe wydarzenie';
    modalBox.classList.remove('wide');
    var ev = id? state.events.find(function(e){return e.id===id;}) : null;
    selectedCat = ev? ev.category : 'meeting';
    var start = ev? ev.start : (prefillStart!=null? minutesToHHMM(prefillStart) : '09:00');
    var end = ev? ev.end : (prefillEnd!=null? minutesToHHMM(prefillEnd) : (prefillStart!=null? minutesToHHMM(Math.min(prefillStart+30,DAY_MIN-1)) : '09:30'));

    modalFields.innerHTML =
      fieldHTML('Nazwa','<input id="mfTitle" class="mf-input" maxlength="60" value="'+(ev?escapeHtml(ev.title):'')+'">')+
      fieldHTML('Kategoria','<div id="mfCatRow" style="display:flex;flex-wrap:wrap;gap:6px;"></div>')+
      fieldHTML('Data','<input id="mfDate" type="date" class="mf-input mono" value="'+state.calDate+'">')+
      '<div class="mf-row">'+
        fieldHTML('Start','<input id="mfStart" type="time" class="mf-input mono" value="'+start+'">')+
        fieldHTML('Koniec','<input id="mfEnd" type="time" class="mf-input mono" value="'+end+'">')+
      '</div>';

    var catRow = document.getElementById('mfCatRow');
    CATEGORIES.forEach(function(c){
      var b=document.createElement('button'); b.type='button';
      b.className='cat-btn'+(selectedCat===c.id?' active':'');
      b.innerHTML='<span class="cat-dot" style="background:'+CAT_COLOR[c.id]+'"></span>'+c.label;
      b.addEventListener('click',function(){ selectedCat=c.id; openEventModal(id, prefillStart, prefillEnd); });
      catRow.appendChild(b);
    });

    deleteBtn.hidden = !id;
    errorText.textContent='';
    overlay.hidden=false;
    document.getElementById('mfTitle').focus();
  }

  function openReminderModal(id){
    modalKind='reminder'; state.editing=id;
    modalTitle.textContent = id? 'Edytuj przypomnienie':'Nowe przypomnienie';
    modalBox.classList.remove('wide');
    var r = id? state.reminders.find(function(x){return x.id===id;}) : null;
    modalFields.innerHTML =
      fieldHTML('Treść','<input id="mfText" class="mf-input" maxlength="120" value="'+(r?escapeHtml(r.text):'')+'">')+
      '<div class="mf-row">'+
        fieldHTML('Data','<input id="mfDate" type="date" class="mf-input mono" value="'+(r?r.date:todayStr())+'">')+
        fieldHTML('Godzina','<input id="mfTime" type="time" class="mf-input mono" value="'+(r?r.time:nowHHMM())+'">')+
      '</div>';
    deleteBtn.hidden = !id;
    errorText.textContent='';
    overlay.hidden=false;
    document.getElementById('mfText').focus();
  }

  function openNoteModal(id){
    modalKind='note'; state.editing=id;
    modalTitle.textContent = id? 'Edytuj notatkę':'Nowa notatka';
    modalBox.classList.add('wide');
    var n = id? state.notes.find(function(x){return x.id===id;}) : null;
    modalFields.innerHTML =
      fieldHTML('Tytuł','<input id="mfTitle" class="mf-input" maxlength="60" value="'+(n?escapeHtml(n.title):'')+'">')+
      fieldHTML('Treść','<textarea id="mfContent" class="mf-textarea large" maxlength="4000">'+(n?escapeHtml(n.content):'')+'</textarea>');
    deleteBtn.hidden = !id;
    errorText.textContent='';
    overlay.hidden=false;
    document.getElementById('mfTitle').focus();
  }

  function closeModal(){ overlay.hidden=true; modalKind=null; state.editing=null; modalBox.classList.remove('wide'); }
  cancelBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !overlay.hidden) closeModal(); });

  saveBtn.addEventListener('click', function(){
    if(modalKind==='event'){
      var title=document.getElementById('mfTitle').value.trim();
      var date=document.getElementById('mfDate').value;
      var start=document.getElementById('mfStart').value;
      var end=document.getElementById('mfEnd').value;
      if(!title){ errorText.textContent='Podaj nazwę wydarzenia.'; return; }
      if(!date||!start||!end){ errorText.textContent='Uzupełnij datę i godziny.'; return; }
      if(toMinutes(end)<=toMinutes(start)){ errorText.textContent='Koniec musi być późniejszy niż start.'; return; }
      var body = {title:title, category:selectedCat, date:date, start:start, end:end};
      var req = state.editing ? apiPut('/api/events/'+state.editing, body) : apiPost('/api/events', body);
      req.then(function(){ state.calDate = date; return reloadEvents(); })
         .then(closeModal)
         .catch(function(){ errorText.textContent='Nie udało się zapisać — sprawdź, czy backend działa.'; });
    } else if(modalKind==='reminder'){
      var text=document.getElementById('mfText').value.trim();
      var rdate=document.getElementById('mfDate').value;
      var rtime=document.getElementById('mfTime').value;
      if(!text){ errorText.textContent='Podaj treść przypomnienia.'; return; }
      if(!rdate||!rtime){ errorText.textContent='Uzupełnij datę i godzinę.'; return; }
      var rbody = {text:text, date:rdate, time:rtime};
      var rreq = state.editing ? apiPut('/api/reminders/'+state.editing, rbody) : apiPost('/api/reminders', rbody);
      rreq.then(reloadReminders).then(closeModal)
          .catch(function(){ errorText.textContent='Nie udało się zapisać — sprawdź, czy backend działa.'; });
    } else if(modalKind==='note'){
      var ntitle=document.getElementById('mfTitle').value.trim();
      var content=document.getElementById('mfContent').value.trim();
      if(!ntitle && !content){ errorText.textContent='Notatka jest pusta.'; return; }
      var nbody = {title:ntitle, content:content};
      var nreq = state.editing ? apiPut('/api/notes/'+state.editing, nbody) : apiPost('/api/notes', nbody);
      nreq.then(reloadNotes).then(closeModal)
          .catch(function(){ errorText.textContent='Nie udało się zapisać — sprawdź, czy backend działa.'; });
    }
  });

  deleteBtn.addEventListener('click', function(){
    if(modalKind==='event'){
      apiDelete('/api/events/'+state.editing).then(reloadEvents).then(closeModal).catch(closeModal);
    } else if(modalKind==='reminder'){
      apiDelete('/api/reminders/'+state.editing).then(reloadReminders).then(closeModal).catch(closeModal);
    } else if(modalKind==='note'){
      apiDelete('/api/notes/'+state.editing).then(reloadNotes).then(closeModal).catch(closeModal);
    }
  });

  // ================= CHAT PANEL (collapsible sidebar) =================
  var chatOpen = true;
  function setChatOpen(open){
    chatOpen = open;
    els.appShell.classList.toggle('chat-collapsed', !open);
    els.chatTab.querySelector('.chevron').textContent = open ? '›' : '‹';
  }
  els.chatTab.addEventListener('click', function(){ setChatOpen(!chatOpen); });

  function renderChat(){
    els.chatLog.innerHTML='';
    if(state.chat.length===0){
      els.chatLog.appendChild(els.chatLogEmpty);
      return;
    }
    state.chat.forEach(function(m){
      var wrap=document.createElement('div');
      wrap.className='msg '+m.role+(m.typing?' typing':'');
      wrap.innerHTML = '<div class="msg-bubble">'+escapeHtml(m.text)+'</div><div class="msg-time">'+(m.time||'')+'</div>';
      els.chatLog.appendChild(wrap);
    });
    els.chatLog.scrollTop = els.chatLog.scrollHeight;
  }

  function pushLocalMessage(role, text, time, typing){
    var m = { role: role, text: text, time: time || nowHHMM(), typing: !!typing };
    state.chat.push(m);
    renderChat();
    return m;
  }

  function sendComposerMessage(){
    var val = els.composerInput.value.trim();
    if(!val) return;
    els.composerInput.value='';
    pushLocalMessage('user', val);
    if(!chatOpen) setChatOpen(true);

    var typingMsg = pushLocalMessage('assistant', 'Piszę odpowiedź…', '', true);

    apiPost('/api/chat', {message: val}).then(function(res){
      var idx = state.chat.indexOf(typingMsg);
      if(idx!==-1) state.chat.splice(idx,1);
      pushLocalMessage('assistant', res.reply);
      reloadEvents(); reloadReminders(); reloadNotes();
    }).catch(function(){
      var idx = state.chat.indexOf(typingMsg);
      if(idx!==-1) state.chat.splice(idx,1);
      pushLocalMessage('assistant', 'Nie mogę połączyć się z backendem. Uruchom: uvicorn main:app --reload --port 8000');
    });
  }

  els.composerInput.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); sendComposerMessage(); }
  });
  els.composerInput.addEventListener('focus', function(){ els.textBubble.classList.add('focused'); });
  els.composerInput.addEventListener('blur', function(){ els.textBubble.classList.remove('focused'); });

  els.voiceBtn.addEventListener('click', function(){
    els.voiceBtn.classList.toggle('active');
    els.voiceBtn.title = els.voiceBtn.classList.contains('active') ? 'Nasłuchiwanie… (wkrótce)' : 'Rozmowa głosowa (wkrótce)';
  });

  // ================= INIT =================
  apiGet('/api/messages').then(function(rows){ state.chat = rows; renderChat(); }).catch(function(){ renderChat(); });
  reloadEvents().then(scrollToNow);
  reloadReminders();
  reloadNotes();

})();
</script>
</body>
</html>
